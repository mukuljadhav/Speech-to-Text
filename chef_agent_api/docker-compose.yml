version: '3.8'

services:
  # Containerized Ollama Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      # Keep pulled models persistent on your host machine
      - ./ollama_data:/root/.ollama
    restart: always

  # FastAPI Backend Service
  chef-api:
    build: .
    container_name: chef_agent_api
    ports:
      - "8000:8000"
    environment:
      # Connect directly to the internal 'ollama' container on the bridge network
      - OLLAMA_URL=http://ollama:11434
      - MODEL_NAME=gemma2:2b
      - DB_PATH=/app/data/chef_agent.db
    volumes:
      # Keep the recipe cache database persistent on your host machine
      - ./data:/app/data
    depends_on:
      - ollama
    restart: always
