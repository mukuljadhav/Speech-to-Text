services:
  # 1. The FastAPI Web Application + Tesseract OCR
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Connect to the ollama service using Docker's internal networking
      - OLLAMA_URL=http://ollama:11434
      - MODEL_NAME=gemma2:2b
      - REQUEST_TIMEOUT=360
    depends_on:
      - ollama

  # 2. The local Ollama Inference Engine
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=60m
    volumes:
      # Persistent storage volume so downloaded models are cached and not deleted when the container stops
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
